name: run_tests
description: Perform test suite and upload test results on failure
inputs:
  additional-pytest-flags:
    description: Additional flags to pass to pytest, i.e., markers
    required: false
    default: ""
  cubitpy_config_path:
    description: Path to the CubitPy config file
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Testing
      shell: bash
      env:
        BEAMME_FOUR_C_EXE: /home/user/4C/bin/4C
        OMPI_MCA_rmaps_base_oversubscribe: 1
      run: |
        export CUBITPY_CONFIG_PATH=${{ inputs.cubitpy_config_path }}
        cd ${GITHUB_WORKSPACE}
        TEMP_DIR="${RUNNER_TEMP}/beamme_pytest"
        mkdir -p "$TEMP_DIR"
        echo "PYTEST_TMPDIR=$TEMP_DIR" >> $GITHUB_ENV

        # On Linux and macOS, we always test with ArborX.
        ARBORX_PYTEST_FLAG=""
        if [[ "${RUNNER_OS}" != "Windows" ]]; then
          python -c "from beamme.geometric_search.utils import arborx_is_available; assert arborx_is_available(), 'ArborX extension was not installed'"
          ARBORX_PYTEST_FLAG="--ArborX"
        fi

        pytest --basetemp="$TEMP_DIR" ${ARBORX_PYTEST_FLAG} ${{ inputs.additional-pytest-flags}} --color=yes

    - name: Upload test results on failure
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: ${{ github.job }}-${{ runner.os }}-python${{ env.PYTHON_VERSION }}-${{ github.run_number }}
        path: ${{ env.PYTEST_TMPDIR }}
