name: install_beamme
description: Install BeamMe with configurable dependencies
inputs:
  install-command:
    description: Command to install BeamMe with pip
    required: false
    default: ".[dev]"
runs:
  using: composite
  steps:
    - name: Install BeamMe
      shell: bash
      run: |
        cd ${GITHUB_WORKSPACE}

        ENABLE_ARBORX="ON"
        # # On Linux and macOS, we always build with ArborX.
        # if [[ "${RUNNER_OS}" != "Windows" ]]; then
        #   ENABLE_ARBORX="ON"
        # fi

        pip install ${{ inputs.install-command }} -Ccmake.define.BEAMME_ENABLE_ARBORX="${ENABLE_ARBORX}"

    - name: Verify python and packages
      shell: bash
      run: |
        which python
        python --version
        pip list
